name: CI e deploy

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # A cada push na main: testa, aplica as migrations no D1 e publica o Worker
  # (API + frontend estático) na Cloudflare. Exige os segredos abaixo no GitHub.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verificar segredos da Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Defina CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions (veja docs/DEPLOY.md)."
            exit 1
          fi
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Aplicar migrations no D1 (remoto)
        working-directory: apps/api
        run: npx wrangler d1 migrations apply affiliate-intelligence --remote
      - name: Publicar o Worker
        working-directory: apps/api
        run: npx wrangler deploy
