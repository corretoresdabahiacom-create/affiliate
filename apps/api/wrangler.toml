name = "affiliate-intelligence"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Um único Worker serve a API (/api/*) e o frontend estático (apps/web/dist).
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/r/*"]

# Workers AI: plano gratuito, sem cartão. Cobertura e limites: docs/AI.md.
[ai]
binding = "AI"

# Agendador (a cada 10 min): reenvio de webhooks, monitor de fontes, resumos e estoque automático, cada um dentro de uma fatia do orçamento da invocação.
[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "affiliate-intelligence"
# Preencha após `wrangler d1 create affiliate-intelligence` (veja docs/DEPLOY.md).
database_id = "e94dbd28-a27b-43a8-b3e4-bc18fc78517e"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
# URL pública do app (usada no link do e-mail). Ajuste para o seu domínio *.workers.dev.
APP_URL = "https://affiliate.corretoresdabahia-com.workers.dev"
# E-mails (separados por vírgula) que viram admin no primeiro login.
ADMIN_EMAILS = ""
EMAIL_FROM = "Affiliate Intelligence <onboarding@example.com>"
# Segredo opcional (wrangler secret put RESEND_API_KEY). Sem ele, o link é só registrado no log.
